config_version: v1
# This is THE SWE node. It deliberately shares the root manifest's name: the
# root declares `superseded_by` pointing here, so installing this repo installs
# this package, and a user who already has the Python swe-planner gets it
# replaced in place — same name, same node id, same triggers, secrets kept.
# Installing the root as a local path (the documented escape hatch) is the one
# way to get the Python node, and it necessarily takes this name over.
name: swe-planner
version: 0.1.0
description: Autonomous SWE planning/execution agent node (Go port; 5 orchestrators + 25 role reasoners)
author: Agent-Field
language: go                            # explicit (also auto-detected from go.mod)

entrypoint:
  build: ./cmd/swe-planner
  start: bin/swe-planner
  healthcheck: /health

agent_node:
  node_id: swe-planner
  # 8005 rather than the Python node's 8003: during the changeover both may be
  # running, and triggers resolve by node id, not port.
  default_port: 8005

user_environment:
  require_one_of:
    # SWE-AF runs on either Claude (Anthropic) or open models via OpenRouter.
    # Provide one. With only an OpenRouter key it auto-selects the open_code
    # runtime.
    - id: llm_provider
      description: an LLM provider key
      options:
        - name: ANTHROPIC_API_KEY
          description: Anthropic API key (Claude)
          type: secret
          scope: global
        - name: OPENROUTER_API_KEY
          description: OpenRouter API key (DeepSeek/Qwen/Llama/… — 200+ models)
          type: secret
          scope: global
  optional:
    # Optional so an LLM key is the only secret needed to get started: builds
    # on local/public repos run without it; it is needed to clone private
    # repos, push branches, and open pull requests.
    - name: GH_TOKEN
      description: GitHub token (repo scope) — needed to clone private repos, push branches, and open pull requests
      type: secret
      scope: global
    - name: SWE_DEFAULT_RUNTIME
      description: Coding runtime for every role (claude_code | open_code | codex)
    - name: SWE_DEFAULT_MODEL
      description: Override the model id for every role (e.g. openrouter/deepseek/deepseek-v4-flash-0731)
    - name: SWE_PRO_ENGINE
      description: >-
        High-performance coding engine (beta). On by default for nodes
        installed this way — set it to 0 (or false) to use the classic coding
        loop instead.
      # The resolver injects this last unless the process env or a stored
      # secret overrides it, so an `af install` gets the engine without asking
      # and `SWE_PRO_ENGINE=0 af run` still opts out.
      default: "1"
    - name: SWE_PRO_VARIANT
      description: Engine reasoning-effort variant (low | high) — unset keeps the engine default
    - name: SWE_PRO_MAX_COST
      description: Per-run USD ceiling for the engine — unset means no per-run cap
    - name: AGENTFIELD_SERVER
      description: Control-plane URL
      default: http://localhost:8080
    - name: AGENTFIELD_API_KEY
      description: Control-plane API key (if auth is enabled)
      type: secret
      scope: global
  # NODE_ID and PORT are deliberately NOT declared here: the installer's
  # runner assigns the port (injected as PORT) and the binary defaults the
  # identity — a manifest default would override the runner's assignment,
  # because resolved user_environment values are appended last to the
  # process env.
